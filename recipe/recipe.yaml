schema_version: 1

context:
  version: 1.0.0

package:
  name: mtcnn
  version: ${{ version }}

source:
- url: https://github.com/ipazc/mtcnn/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 90b2f337e359b6881891c4869689c642865cdfa91df1e232d35953b294e7a955

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - joblib >=1.4.2
    - lz4 >=4.3.3
    - tensorflow >=2.12.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mtcnn
        - mtcnn.network
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - '*'
  - script:
      - pytest -vvv tests/test_mtcnn.py
    requirements:
      run:
        - pytest
        - pytest-cov
    files:
      source:
        - tests/

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Multi-task Cascaded Convolutional Neural Networks for Face Detection, based on TensorFlow
  homepage: http://github.com/ipazc/mtcnn
  repository: http://github.com/ipazc/mtcnn

extra:
  recipe-maintainers:
    - mxr-conda
    - Tata17
    - oblute
    - benhuff
    - rluria14
